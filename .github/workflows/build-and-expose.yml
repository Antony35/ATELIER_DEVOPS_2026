name: build-and-expose

on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances de dev
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest -v
  secrets:
      runs-on: ubuntu-latest
      timeout-minutes: 5
      steps:
        - name: Récupérer le code (avec tout l'historique)
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Scan de secrets (gitleaks)
          uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  security:
      needs: quality
      runs-on: ubuntu-latest
      timeout-minutes: 10
      steps:
        - name: Récupérer le code
          uses: actions/checkout@v4

        - name: Construire l'image Docker
          run: docker build -t flask-app .

        - name: Scan de vulnérabilités (Trivy)
          uses: aquasecurity/trivy-action@master
          with:
            image-ref: flask-app
            severity: CRITICAL
            exit-code: '1'
            ignore-unfixed: true
  build-push:
      needs: security
      runs-on: ubuntu-latest
      timeout-minutes: 10
      permissions:
        contents: read
        packages: write
      steps:
        - name: Récupérer le code
          uses: actions/checkout@v4

        - name: Se connecter à GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Générer les tags et labels
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}
            tags: |
              type=raw,value=latest,enable={{is_default_branch}}
              type=sha
              type=ref,event=pr

        - name: Build et push vers GHCR
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
  ngrok:
    needs: [security, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t flask-app .

      - name: Lancer le conteneur Flask
        run: docker run -d -p 5000:5000 --name flask flask-app

      - name: Lancer le tunnel Ngrok
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: docker run -d --network host --name ngrok-agent -e NGROK_AUTHTOKEN ngrok/ngrok http 5000

      - name: Récupérer et afficher l'URL publique
        run: |
          for i in $(seq 1 10); do
            URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
            if [ -n "$URL" ] && [ "$URL" != "null" ]; then break; fi
            sleep 2
          done
          echo "URL publique : $URL"
          echo "### 🔗 URL publique Ngrok : $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Garder le tunnel ouvert ~120 s
        run: sleep 120

      - name: Arrêt propre
        if: always()
        run: docker stop flask ngrok-agent || true